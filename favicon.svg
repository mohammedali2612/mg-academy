<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#1B365D" />
    </linearGradient>

    <!-- Palette Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="6" />

  <!-- Artist Palette Shape (representing Art & Creativity) -->
  <path d="M 256 100 C 170 100 100 170 100 256 C 100 342 165 412 245 412 C 265 412 280 398 280 380 C 280 371 276 363 270 356 C 264 348 260 340 260 330 C 260 311 276 295 295 295 L 340 295 C 382 295 412 265 412 222 C 412 155 342 100 256 100 Z"
        fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="8" stroke-linejoin="round" />

  <!-- Colorful Art Dots on Palette -->
  <circle cx="170" cy="200" r="22" fill="#FF5964" />
  <circle cx="230" cy="165" r="20" fill="#FFD166" />
  <circle cx="300" cy="175" r="22" fill="#06D6A0" />
  <circle cx="360" cy="225" r="20" fill="#38BDF8" />

  <!-- Big Bold Modern MG Letters -->
  <text x="256" y="348" text-anchor="middle"
        font-family="'Peace Sans', 'Montserrat', 'Inter', -apple-system, sans-serif"
        font-size="160" font-weight="900" fill="#FFFFFF"
        filter="drop-shadow(0 6px 16px rgba(0,0,0,0.4))">MG</text>

  <!-- Twinkling Star Accent at Top Right -->
  <path d="M 390 100 L 398 122 L 420 130 L 398 138 L 390 160 L 382 138 L 360 130 L 382 122 Z"
        fill="url(#accentGrad)" filter="url(#softGlow)" />
</svg>
